<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarScout Dashboard</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="app-header">
  <h1>🛰️ StarScout</h1>
  <p class="tagline">Monitor. Notify. Stay Alert.</p>
</header>

<main>
  <section class="summary">
    <div class="summary-card normal">
      <span class="count" id="count-normal">0</span>
      <span class="label">NORMAL</span>
    </div>
    <div class="summary-card warning">
      <span class="count" id="count-warning">0</span>
      <span class="label">WARNING</span>
    </div>
    <div class="summary-card down">
      <span class="count" id="count-down">0</span>
      <span class="label">DOWN</span>
    </div>
    <div class="summary-card unknown">
      <span class="count" id="count-unknown">0</span>
      <span class="label">UNKNOWN</span>
    </div>
  </section>

  <section class="targets">
    <div class="section-header">
      <h2>監視対象</h2>
      <button id="toggle-form-btn" class="btn primary">+ 新規登録</button>
    </div>

    <form id="target-form" class="target-form" hidden>
      <div class="form-row">
        <label>表示名 <input type="text" name="name" required></label>
        <label>URL <input type="url" name="url" required placeholder="https://example.com"></label>
      </div>
      <div class="form-row">
        <label>監視間隔(秒) <input type="number" name="intervalSec" value="60" min="5"></label>
        <label>タイムアウト(秒) <input type="number" name="timeoutSec" value="5" min="1"></label>
        <label>正常ステータス <input type="text" name="expectedStatusPattern" value="2xx"></label>
        <label>WARNING閾値(ms) <input type="number" name="warningThresholdMs" value="2000" min="0"></label>
        <label>Keyword(任意) <input type="text" name="keyword" placeholder="ページに含まれるべき文字列"></label>
      </div>
      <div class="form-row">
        <label class="checkbox"><input type="checkbox" name="warningNotifyEnabled"> WARNING時に通知</label>
        <button type="submit" id="submit-form-btn" class="btn primary">登録</button>
        <button type="button" id="cancel-form-btn" class="btn">キャンセル</button>
      </div>
    </form>

    <table class="target-table">
      <thead>
        <tr>
          <th>状態</th>
          <th>名前</th>
          <th>URL</th>
          <th>HTTP</th>
          <th>応答時間</th>
          <th>最終チェック</th>
          <th>障害開始</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="target-rows">
        <tr><td colspan="8" class="empty">読み込み中...</td></tr>
      </tbody>
    </table>
  </section>
</main>

<div id="detail-modal" class="modal-overlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h3 id="detail-title">詳細</h3>
      <button id="detail-close-btn" class="btn">閉じる</button>
    </div>

    <div class="content-section">
      <div class="content-row">
        <span class="content-label">初期タイトル</span>
        <span id="detail-initial-title">-</span>
      </div>
      <div class="content-row">
        <span class="content-label">現在のタイトル</span>
        <span id="detail-current-title">-</span>
        <span id="detail-title-changed-badge" class="badge-changed" hidden>変更あり</span>
      </div>
      <div class="content-row" id="detail-keyword-row" hidden>
        <span class="content-label">Keyword</span>
        <span id="detail-keyword-status">-</span>
      </div>
    </div>

    <div class="period-tabs" id="period-tabs">
      <button class="period-tab" data-period="24h">24時間</button>
      <button class="period-tab" data-period="7d">7日間</button>
      <button class="period-tab" data-period="30d">30日間</button>
    </div>

    <div class="stat-cards">
      <div class="stat-card">
        <span class="stat-value" id="stat-avg-response">-</span>
        <span class="stat-label">平均応答時間</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-uptime">-</span>
        <span class="stat-label">稼働率</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-incident-count">-</span>
        <span class="stat-label">インシデント件数</span>
      </div>
      <div class="stat-card">
        <span class="stat-value" id="stat-downtime">-</span>
        <span class="stat-label">総ダウンタイム</span>
      </div>
    </div>

    <div class="chart-container" id="response-chart"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
